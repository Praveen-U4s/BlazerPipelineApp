# Azure Pipelines CI for .NET 8 Blazor project
# Triggers on pushes to branch 'master' (also include 'main' for compatibility)
parameters:
- name: environment
  displayName: Target Environment
  type: string
  default: Development
  values:
    - Development
    - Staging
    - Production

trigger:
  branches:
    include:
      - master
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
- name: buildConfiguration
  value: 'Release'
- name: solution
  value: '**/*.sln'

# Conditional variables and variable groups
- ${{ if eq(parameters.environment, 'Development') }}:
  - name: EnvFileName
    value: 'Development'
  - group: Sample-Blazer-App-Dev

- ${{ if eq(parameters.environment, 'Staging') }}:
  - name: EnvFileName
    value: 'Staging'
  - group: Sample-Blazer-App-Staging

- ${{ if eq(parameters.environment, 'Production') }}:
  - name: EnvFileName
    value: 'Production'
  - group: Sample-Blazer-App-Prod

steps:
- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'

- script: dotnet restore
  displayName: 'dotnet restore'

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'dotnet build'

- script: dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish /p:EnvironmentName=$(EnvFileName) --no-build
  displayName: 'dotnet publish'
  env:
      ASPNETCORE_ENVIRONMENT: $(EnvFileName)
      ConnectionStrings__DefaultConnection: $(ConnectionStrings.DefaultConnection)

- script: |
    echo "Updating connection string in appsettings..."

    publishFolder="$(Build.ArtifactStagingDirectory)/publish"
    mkdir -p "$publishFolder"

    # Determine which appsettings file to modify
    if [ -n "$ENV_FILENAME" ]; then
        targetFile="$publishFolder/appsettings.$ENV_FILENAME.json"
    else
        targetFile="$publishFolder/appsettings.json"
    fi

    echo "Target file: $targetFile"

    # Ensure the file exists (copy from source if needed)
    if [ ! -f "$targetFile" ]; then
        echo "File not found in publish folder, copying original..."
        cp "**/appsettings.$ENV_FILENAME.json" "$targetFile" 2>/dev/null || cp "**/appsettings.json" "$targetFile"
    fi

    echo "Injecting connection string..."

    # Update JSON (ONLY modify DefaultConnection)
    jq --arg conn "$DEFAULT_CONN" \
       '.ConnectionStrings.DefaultConnection = $conn' \
       "$targetFile" > "$targetFile.tmp"

    mv "$targetFile.tmp" "$targetFile"

    echo "Connection string updated successfully."
  displayName: "Inject connection string into published appsettings"
  env:
    DEFAULT_CONN: $(ConnectionStrings.DefaultConnection)
    ENV_FILENAME: $(EnvFileName)

- task: ArchiveFiles@2
  displayName: 'Archive publish output to ZIP'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/BlazerPipelineApp.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish artifact (ZIP)'
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)/BlazerPipelineApp.zip'
    artifactName: 'BlazerPipelineApp'
    publishLocation: 'Container'
