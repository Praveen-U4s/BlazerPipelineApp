# Azure Pipelines CI for .NET 8 Razor/Blazor project
# Triggers on pushes to branch 'master'
trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'

- script: dotnet restore
  displayName: 'dotnet restore'

- script: dotnet build --configuration $(buildConfiguration) --no-restore
  displayName: 'dotnet build'

- script: dotnet publish --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish --no-build
  displayName: 'dotnet publish'

- task: ArchiveFiles@2
  displayName: 'Archive publish output to ZIP'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/publish.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish artifact (ZIP)'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish.zip'
    ArtifactName: 'BlazerWebApp'
    publishLocation: 'Container'
